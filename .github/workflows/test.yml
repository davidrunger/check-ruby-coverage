name: Test

on:
  pull_request:
    branches:
      - '*'
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      cancel-in-progress: true
      group: test-${{ github.ref_name }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@e1bd6146574da5e0795075b5319b300edb30c5b0 # v1.333.0

      - name: Run tests
        run: ruby test/check-ruby-coverage

      - name: Run release tests
        run: ruby test/release

      - name: Check a complete report with the action
        uses: ./
        with:
          coverage-file: test/fixtures/complete.xml
