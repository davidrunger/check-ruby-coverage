name: Test

on:
  pull_request:
    branches:
      - '*'
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      cancel-in-progress: true
      group: test-${{ github.ref_name }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0

      - name: Run tests
        run: ruby test/check-ruby-coverage

      - name: Run release tests
        run: ruby test/release

      - name: Check a complete report with the action
        uses: ./
        with:
          coverage-file: test/fixtures/complete.xml
